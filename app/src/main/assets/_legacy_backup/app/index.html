<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Istiqamat</title>
  <link href="style.css" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>

<body>
  <!-- Error Logger for Debugging -->
  <div id="error-log"
    style="display:none; color:red; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:9999; padding:20px; overflow:scroll;">
  </div>
  <script>
    window.onerror = function (msg, url, line, col, error) {
      var log = document.getElementById('error-log');
      log.style.display = 'block';
      log.innerHTML += '<p>' + msg + '<br><small>' + url + ':' + line + '</small></p>';
      return false;
    };
  </script>

  <div id="app"></div>
  <script type="module" src="main.js"></script>
</body>

</html>
